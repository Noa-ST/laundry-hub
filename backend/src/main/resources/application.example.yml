server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  jwtSecret: ${APP_JWTSECRET:YOUR_BASE64_32BYTE_SECRET_KEY_HERE}
  jwtExpirationMs: ${APP_JWT_EXPIRATION_MS:1800000}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/laundry_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:YOUR_LOCAL_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false

payos:
  client-id: ${PAYOS_CLIENT_ID:YOUR_PAYOS_CLIENT_ID}
  api-key: ${PAYOS_API_KEY:YOUR_PAYOS_API_KEY}
  checksum-key: ${PAYOS_CHECKSUM_KEY:YOUR_PAYOS_CHECKSUM_KEY}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:YOUR_CLOUDINARY_NAME}
  api-key: ${CLOUDINARY_API_KEY:YOUR_CLOUDINARY_KEY}
  api-secret: ${CLOUDINARY_API_SECRET:YOUR_CLOUDINARY_SECRET}
